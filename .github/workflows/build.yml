name: Build Fluck Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0.1'
    
    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
    
    - name: Install GNU Make
      run: |
        brew install make
        echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV
    
    - name: Install ldid
      run: |
        git clone https://github.com/ProcursusTeam/ldid.git
        cd ldid
        git submodule update --init
        make
        sudo make install
        echo "$(pwd)" >> $GITHUB_PATH
    
    - name: Build dylib (unsigned)
      run: |
        export THEOS=$HOME/theos
        export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
        # Tắt ký mã để build không cần ldid
        export CODESIGN_ALLOCATE=/usr/bin/codesign_allocate
        make
      env:
        TARGET_CODESIGN: "echo"
    
    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: fluck-dylib
        path: .theos/obj/debug/fluck.dylib
        if-no-files-found: error
    
    - name: Upload deb package
      uses: actions/upload-artifact@v4
      with:
        name: fluck-deb
        path: ./*.deb
        if-no-files-found: error
