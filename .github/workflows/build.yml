name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile fluck.dylib
        run: |
          clang++ -dynamiclib -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework AVFoundation \
            -framework WebKit \
            -framework MediaPlayer \
            -framework CoreMedia \
            -Oz \
            -o fluck.dylib \
            fluck.mm \
            -lc++ \
            -ObjC

      - name: Show file info
        run: |
          echo "📦 File size:"
          ls -lh fluck.dylib
          echo ""
          echo "🔍 File info:"
          file fluck.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluck
          path: fluck.dylib
