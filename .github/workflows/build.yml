name: Build Fluck Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup iOS SDK
        run: |
          # Lấy SDK path từ Xcode
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(echo $SDK_PATH | grep -oE '[0-9]+\.[0-9]+' | head -1)
          
          echo "📱 iOS SDK: $SDK_PATH"
          echo "📱 SDK Version: $SDK_VERSION"
          
          # Tạo symlink
          mkdir -p $HOME/theos/sdks
          ln -sf "$SDK_PATH" $HOME/theos/sdks/iPhoneOS${SDK_VERSION}.sdk
          ln -sf "$SDK_PATH" $HOME/theos/sdks/iPhoneOS.sdk

      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          export SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          make clean
          make package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluck
          path: packages/*.deb
