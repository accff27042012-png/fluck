name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile ffhack
        run: |
          clang++ -dynamiclib -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework AVFoundation \
            -framework CoreLocation \
            -framework MapKit \
            -framework WebKit \
            -framework SceneKit \
            -framework SpriteKit \
            -framework Metal \
            -framework CoreImage \
            -framework Security \
            -framework SystemConfiguration \
            -Oz \
            -o libffhack.dylib \
            ffhack.mm \
            -lz \
            -lc++ \
            -ObjC

      - name: Show file info
        run: |
          echo "📦 File size:"
          ls -lh libffhack.dylib
          echo ""
          echo "🔍 File info:"
          file libffhack.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libffhack
          path: libffhack.dylib
